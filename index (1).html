<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KPSS İlanları</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14213d;--mute:#5b6678;--line:#d5dbe3;--acc:#1b4fd8;--new:#c2410c;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0f1520;--card:#18212f;--ink:#e8edf5;--mute:#93a0b5;--line:#2a3548;--acc:#6f9bff;--new:#fb923c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,'Times New Roman',serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.7rem;margin:8px 0 2px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 16px;font-size:.95rem}
input{width:100%;padding:12px 14px;font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
input:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
.chips button{flex:none;padding:7px 13px;font:inherit;font-size:.9rem;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{color:var(--mute);font-size:.9rem;margin:4px 0 8px}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li{border-bottom:1px solid var(--line)}
li a{display:block;padding:14px 2px;color:inherit;text-decoration:none}
li a:hover .t{color:var(--acc)}
.t{font-weight:600;font-size:1.05rem}
.m{color:var(--mute);font-size:.88rem;margin-top:2px}
.new{color:var(--new);font-weight:700;margin-right:6px}
.empty,.note{color:var(--mute);padding:20px 0}
.note{font-size:.85rem;border-top:1px solid var(--line);margin-top:16px}
</style>
</head>
<body>
<main>
  <h1>KPSS ilanları</h1>
  <p class="sub" id="upd">Yükleniyor…</p>
  <input id="q" type="search" placeholder="Kurum veya ilan ara" aria-label="Ara">
  <div class="chips" id="chips"></div>
  <div class="count" id="count"></div>
  <ul id="list"></ul>
  <div class="note" id="note" hidden>Şu an örnek veriler gösteriliyor. Gerçek ilanlar, ilan toplama scripti çalışınca ilanlar.json dosyasından gelecek.</div>
</main>
<script>
const day=864e5;
function sample(){
  const d=n=>new Date(Date.now()-n*day).toISOString().slice(0,10);
  return [
    {baslik:"Sağlık Bakanlığı 2.000 sözleşmeli personel alımı (örnek)",kurum:"Sağlık Bakanlığı",kaynak:"Kariyer Kapısı",tarih:d(0),link:"#"},
    {baslik:"Üniversite sürekli işçi alımı (örnek)",kurum:"Örnek Üniversitesi",kaynak:"İŞKUR",tarih:d(1),link:"#"},
    {baslik:"Belediye zabıta memuru alımı (örnek)",kurum:"Örnek Belediyesi",kaynak:"Kamu İlan",tarih:d(2),link:"#"},
    {baslik:"Öğretim görevlisi kadro ilanı (örnek)",kurum:"Örnek Üniversitesi",kaynak:"İlan.gov.tr",tarih:d(6),link:"#"},
    {baslik:"Tercih kılavuzu yayımlandı (örnek)",kurum:"ÖSYM",kaynak:"ÖSYM",tarih:d(9),link:"#"}
  ];
}
let all=[],src="Tümü";
const $=id=>document.getElementById(id);
const isNew=t=>(Date.now()-new Date(t).getTime())<3*day;
function fmt(t){return new Date(t).toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"})}
function chips(){
  const names=["Tümü",...new Set(all.map(i=>i.kaynak))];
  $("chips").replaceChildren(...names.map(n=>{
    const b=document.createElement("button");
    b.textContent=n;b.setAttribute("aria-pressed",n===src);
    b.onclick=()=>{src=n;chips();render()};return b;
  }));
}
function render(){
  const q=$("q").value.trim().toLocaleLowerCase("tr");
  const rows=all.filter(i=>(src==="Tümü"||i.kaynak===src)&&(i.baslik+" "+i.kurum).toLocaleLowerCase("tr").includes(q));
  $("count").textContent=rows.length+" ilan";
  if(!rows.length){const e=document.createElement("li");e.className="empty";e.textContent="Eşleşen ilan yok. Aramayı veya kaynak filtresini değiştir.";$("list").replaceChildren(e);return}
  $("list").replaceChildren(...rows.map(i=>{
    const li=document.createElement("li"),a=document.createElement("a");
    a.href=i.link;a.target="_blank";a.rel="noopener";
    const t=document.createElement("div");t.className="t";
    if(isNew(i.tarih)){const n=document.createElement("span");n.className="new";n.textContent="Yeni";t.append(n)}
    t.append(i.baslik);
    const m=document.createElement("div");m.className="m";
    m.textContent=i.kurum+" • "+i.kaynak+" • "+fmt(i.tarih);
    a.append(t,m);li.append(a);return li;
  }));
}
async function init(){
  let demo=false;
  try{
    const r=await fetch("ilanlar.json",{cache:"no-store"});
    if(!r.ok)throw 0;
    const j=await r.json();
    all=j.ilanlar;
    $("upd").textContent="Son güncelleme: "+new Date(j.guncelleme).toLocaleString("tr-TR");
  }catch(e){all=sample();demo=true;$("upd").textContent="Örnek görünüm"}
  all.sort((a,b)=>b.tarih.localeCompare(a.tarih));
  $("note").hidden=!demo;
  chips();render();
}
$("q").addEventListener("input",render);
init();
</script>
</body>
</html>
