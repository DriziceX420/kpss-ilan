name: Kaynak testi 4
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Haber akışlarını dene
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python3 - <<'EOF'
          import os, re, urllib.request, urllib.parse
          import xml.etree.ElementTree as ET
          H = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36"}
          def get(url):
            req = urllib.request.Request(url, headers=H)
            with urllib.request.urlopen(req, timeout=25) as r:
              return r.read()
          out = []
          for q in ["KPSS lise mezunu personel alımı", "kamu personel alımı ilanı"]:
            url = "https://news.google.com/rss/search?q=" + urllib.parse.quote(q) + "&hl=tr&gl=TR&ceid=TR:tr"
            try:
              kok = ET.fromstring(get(url))
              ogeler = kok.findall(".//item")
              out.append("Google Haberler [%s]: %d haber" % (q, len(ogeler)))
              for o in ogeler[:3]:
                out.append("  - %s (%s)" % (o.findtext("title", "")[:70], o.findtext("pubDate", "")[:16]))
            except Exception as e:
              out.append("Google Haberler HATA %s %s" % (type(e).__name__, str(e)[:50]))
          for ad, url in {"memurlar ilan": "https://ilan.memurlar.net/", "memurlar rss": "https://www.memurlar.net/rss/"}.items():
            try:
              g = get(url).decode("utf-8", "ignore")
              out.append("%s: acildi, %d karakter, rss etiketi: %s" % (ad, len(g), "<item" in g))
            except Exception as e:
              out.append("%s HATA %s %s" % (ad, type(e).__name__, str(e)[:50]))
          ozet = "\n".join(out)[:3500]
          print(ozet)
          topic = os.environ.get("NTFY_TOPIC", "")
          if topic:
            req = urllib.request.Request("https://ntfy.sh/" + topic, data=ozet.encode("utf-8"),
                                         headers={"Title": "KPSS kaynak testi 4"})
            urllib.request.urlopen(req, timeout=20)
          EOF
